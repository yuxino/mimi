name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mimi-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Compile macOS without producing a runnable artifact. Windows still builds
  # an installer because it has no equivalent persistent privacy identity.
  # Formal macOS packages are produced only by the stable release identity.
  bundle:
    if: ${{ github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Compile macOS without a runnable bundle
        if: ${{ matrix.os == 'macos-latest' }}
        run: npm run tauri -- build --no-bundle

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        if: ${{ matrix.os == 'windows-latest' }}

      - name: Upload bundles
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimi-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  release-preflight:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json").version;
            const tauri = require("./src-tauri/tauri.conf.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8")
              .match(/^version = "([^"]+)"/m)?.[1];
            const expected = `v${pkg}`;
            if (process.env.RELEASE_TAG !== expected || tauri !== pkg || cargo !== pkg) {
              throw new Error(`release versions disagree: tag=${process.env.RELEASE_TAG}, package=${pkg}, tauri=${tauri}, cargo=${cargo}`);
            }
          '
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

  # GitHub macOS releases use one persistent self-signed identity. It does not
  # bypass Gatekeeper, but its stable designated requirement lets TCC recognize
  # the same app across updates. File-based Keychain access has an additional
  # partition check and this self-signed certificate has no Apple Team ID, so
  # password-free credential access across every binary update is not promised.
  # The certificate is pinned in source. Its CI-accessible private-key copy
  # exists only in the protected github-release environment; any offline
  # encrypted backup remains outside CI.
  release-macos:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: macos-latest
    environment: github-release
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MIMI_RELEASE_CERT_SHA256: "25c45861a0f4455fd6ac6161ae3e65035c83b7447e2b2092d93eae26b548d9e6"
    needs: [rust, frontend, release-preflight]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Remove stale macOS package outputs
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos"
          rm -rf "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg"

      - name: Import persistent GitHub release identity
        env:
          MACOS_RELEASE_CERTIFICATE: ${{ secrets.MACOS_RELEASE_CERTIFICATE }}
          MACOS_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_RELEASE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_RELEASE_CERTIFICATE" || -z "$MACOS_RELEASE_CERTIFICATE_PASSWORD" ]]; then
            echo "Missing the persistent macOS GitHub release identity." >&2
            exit 1
          fi

          umask 077
          certificate_path="$RUNNER_TEMP/mimi-github-release.p12"
          certificate_bundle="$RUNNER_TEMP/mimi-github-release-certificates.pem"
          certificate_pem="$RUNNER_TEMP/mimi-github-release.pem"
          keychain_path="$RUNNER_TEMP/mimi-github-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_RELEASE_CERTIFICATE" | base64 --decode > "$certificate_path"
          openssl pkcs12 \
            -in "$certificate_path" \
            -nokeys \
            -passin env:MACOS_RELEASE_CERTIFICATE_PASSWORD \
            -out "$certificate_bundle"
          certificate_count="$(awk '/BEGIN CERTIFICATE/{count++} END{print count+0}' "$certificate_bundle")"
          if [[ "$certificate_count" != "1" ]]; then
            echo "The release identity must contain exactly one certificate." >&2
            exit 1
          fi
          openssl x509 -in "$certificate_bundle" -out "$certificate_pem"

          actual_sha256="$(
            openssl x509 -in "$certificate_pem" -noout -fingerprint -sha256 \
              | sed 's/.*=//;s/://g' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$actual_sha256" != "$MIMI_RELEASE_CERT_SHA256" ]]; then
            echo "The macOS release certificate does not match the pinned identity." >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_RELEASE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$certificate_path"
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"

          certificate_sha1="$(
            openssl x509 -in "$certificate_pem" -noout -fingerprint -sha1 \
              | sed 's/.*=//;s/://g' \
              | tr '[:lower:]' '[:upper:]'
          )"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -Fq "$certificate_sha1"; then
            echo "The certificate is not a valid code-signing identity." >&2
            exit 1
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$certificate_sha1"
            echo "MIMI_EXPECTED_CERT_SHA1=$(printf '%s' "$certificate_sha1" | tr '[:upper:]' '[:lower:]')"
            echo "MIMI_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build signed macOS GitHub package
        run: npm run tauri build

      - name: Sign final disk image
        shell: bash
        run: |
          set -euo pipefail
          dmg_paths=()
          while IFS= read -r -d '' candidate; do
            dmg_paths+=("$candidate")
          done < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f -print0)
          if [[ "${#dmg_paths[@]}" != "1" ]]; then
            echo "Expected exactly one macOS DMG artifact; found ${#dmg_paths[@]}." >&2
            exit 1
          fi
          dmg_path="${dmg_paths[0]}"
          codesign \
            --force \
            --timestamp=none \
            --keychain "$MIMI_SIGNING_KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$dmg_path"

      - name: Verify and stage the macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          app_paths=()
          while IFS= read -r -d '' candidate; do
            app_paths+=("$candidate")
          done < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos" -maxdepth 1 -name '*.app' -type d -print0)
          dmg_paths=()
          while IFS= read -r -d '' candidate; do
            dmg_paths+=("$candidate")
          done < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f -print0)
          if [[ "${#app_paths[@]}" != "1" || "${#dmg_paths[@]}" != "1" ]]; then
            echo "Expected exactly one macOS app and one DMG artifact." >&2
            exit 1
          fi
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"
          ./scripts/verify-macos-release.sh "$app_path" "$dmg_path"
          staging_dir="$RUNNER_TEMP/mimi-release-assets"
          mkdir -p "$staging_dir"
          cp "$dmg_path" "$staging_dir/"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          cleanup_failed=0
          security default-keychain -d user -s login.keychain-db >/dev/null 2>&1 || cleanup_failed=1
          security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || cleanup_failed=1
          if [[ -f "$RUNNER_TEMP/mimi-github-release.pem" ]]; then
            sudo -n security remove-trusted-cert -d "$RUNNER_TEMP/mimi-github-release.pem" >/dev/null 2>&1 || cleanup_failed=1
          fi
          if [[ -f "$RUNNER_TEMP/mimi-github-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/mimi-github-release.keychain-db" >/dev/null 2>&1 || cleanup_failed=1
          fi
          rm -f \
            "$RUNNER_TEMP/mimi-github-release.p12" \
            "$RUNNER_TEMP/mimi-github-release-certificates.pem" \
            "$RUNNER_TEMP/mimi-github-release.pem"
          if [[ -e "$RUNNER_TEMP/mimi-github-release.p12" || -e "$RUNNER_TEMP/mimi-github-release.keychain-db" ]]; then
            cleanup_failed=1
          fi
          exit "$cleanup_failed"

      - name: Upload verified macOS release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimi-release-macos
          path: ${{ runner.temp }}/mimi-release-assets/*.dmg
          if-no-files-found: error

  release-windows:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    needs: [rust, frontend, release-preflight]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Remove stale Windows package outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/msi" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis" -ErrorAction SilentlyContinue

      - run: npm run tauri build

      - name: Verify and stage Windows release assets
        shell: pwsh
        run: |
          $version = (Get-Content "$env:GITHUB_WORKSPACE/package.json" | ConvertFrom-Json).version
          $bundleDir = "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle"
          $expectedPaths = @(
            "$bundleDir/msi/mimi_${version}_x64_en-US.msi",
            "$bundleDir/nsis/mimi_${version}_x64-setup.exe"
          )
          $actualPaths = @(
            Get-ChildItem $bundleDir -Recurse -File |
              Where-Object { $_.Extension -eq '.msi' -or $_.Name -like '*-setup.exe' } |
              ForEach-Object { $_.FullName }
          )
          if ($actualPaths.Count -ne 2) {
            throw "Expected exactly one MSI and one setup EXE; found $($actualPaths.Count) package files."
          }
          foreach ($expectedPath in $expectedPaths) {
            if (-not (Test-Path -LiteralPath $expectedPath -PathType Leaf)) {
              throw "Missing expected Windows package: $expectedPath"
            }
          }
          if (Compare-Object ($actualPaths | Sort-Object) ($expectedPaths | Sort-Object)) {
            throw "Windows package output contains an unexpected installer."
          }
          $stagingDir = "$env:RUNNER_TEMP/mimi-release-assets"
          New-Item -ItemType Directory -Force $stagingDir | Out-Null
          Copy-Item -LiteralPath $expectedPaths -Destination $stagingDir

      - name: Upload verified Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimi-release-windows
          path: ${{ runner.temp }}/mimi-release-assets/*
          if-no-files-found: error

  # This is the only job with release authority. It runs only after both
  # platform builds and the pinned macOS identity checks have passed, so a
  # malformed or one-off privacy identity cannot become a public release.
  publish-release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs: [release-macos, release-windows]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mimi-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish verified installers
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          version="${GITHUB_REF_NAME#v}"
          expected_names=(
            "mimi_${version}_aarch64.dmg"
            "mimi_${version}_x64-setup.exe"
            "mimi_${version}_x64_en-US.msi"
          )
          mapfile -t actual_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          mapfile -t expected_names < <(printf '%s\n' "${expected_names[@]}" | sort)
          if [[ "${actual_names[*]}" != "${expected_names[*]}" ]]; then
            echo "Downloaded artifacts do not exactly match the expected release assets." >&2
            printf 'expected: %s\n' "${expected_names[*]}" >&2
            printf 'actual: %s\n' "${actual_names[*]}" >&2
            exit 1
          fi

          remote_commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "The release tag no longer points to this workflow commit." >&2
            exit 1
          fi

          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            highest_version="$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -1)"
            if [[ "$highest_version" != "$version" || "$latest_version" == "$version" ]]; then
              echo "Refusing to publish $version as Latest over existing release $latest_version." >&2
              exit 1
            fi
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on an already-published release." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "mimi $GITHUB_REF_NAME" --notes "Release assets are still being verified."
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

          mapfile -t expected_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          mapfile -t published_names < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          if [[ "${expected_names[*]}" != "${published_names[*]}" ]]; then
            echo "Draft release assets do not exactly match the verified build outputs." >&2
            printf 'expected: %s\n' "${expected_names[*]}" >&2
            printf 'actual: %s\n' "${published_names[*]}" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            asset_name="${asset##*/}"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_digest="$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name == \"$asset_name\") | .digest")"
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "The uploaded digest does not match $asset_name." >&2
              exit 1
            fi
          done

          remote_commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "The release tag moved while assets were uploading." >&2
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --title "mimi $GITHUB_REF_NAME" --notes "GitHub packages for macOS (Apple Silicon) and Windows. On first launch, macOS may require Open Anyway in System Settings → Privacy & Security. Users upgrading from a build signed with a different identity may need to approve Screen & System Audio Recording once. Because this distribution is self-signed without an Apple Team ID, macOS may still ask once for Keychain access after a binary update." --draft=false --latest
