name: ci

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope (full checks every platform)
        type: choice
        default: quick
        options: [quick, full]
      packages:
        description: Optional native acceptance package (no release)
        type: choice
        default: none
        options: [none, linux, windows, macos, all]
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mimi-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.plan.outputs.native }}
      rust_os: ${{ steps.plan.outputs.rust_os }}
      windows_arm: ${{ steps.plan.outputs.windows_arm }}
      arm_bundle: ${{ steps.plan.outputs.arm_bundle }}
      bundle: ${{ steps.plan.outputs.bundle }}
      bundle_os: ${{ steps.plan.outputs.bundle_os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify scope rules
        run: python3 scripts/ci-scope-test.py
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_VALIDATION: ${{ inputs.validation }}
          CI_PACKAGES: ${{ inputs.packages }}
        run: python3 scripts/ci-scope.py

  rust:
    needs: scope
    if: ${{ needs.scope.outputs.native == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.rust_os) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-ci-deps.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - name: macOS release safety tests
        if: runner.os == 'macOS'
        run: |
          ./scripts/macos-signing-test.sh
          python3 scripts/extract-macos-updater-test.py

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Shared subtitle core and JNI adapter
        shell: bash
        run: bash scripts/check-shared-core.sh

      - name: Test Linux system and microphone capture with real PulseAudio
        if: runner.os == 'Linux'
        run: dbus-run-session -- ./scripts/linux-audio-smoke.sh

      - name: Test Linux credential storage with isolated Secret Service
        if: runner.os == 'Linux'
        run: ./scripts/linux-keyring-smoke.sh

      - name: Test Linux credential recovery after Secret Service appears
        if: runner.os == 'Linux'
        run: ./scripts/linux-keyring-recovery-smoke.sh

      - name: Test first credential save with a new Linux keyring
        if: runner.os == 'Linux'
        run: ./scripts/linux-keyring-first-save-smoke.sh

      - name: Check Intel macOS target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Test vendored WASAPI capture packets
        if: ${{ matrix.os == 'windows-2025' }}
        run: cargo test --manifest-path src-tauri/vendor/cpal/Cargo.toml --lib capture_packet_tests

  windows-arm64:
    needs: scope
    if: ${{ needs.scope.outputs.windows_arm == 'true' }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
          shared-key: windows-arm64

      - run: npm ci

      - name: Verify native ARM64 toolchain
        shell: pwsh
        run: |
          $hostTriple = rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }
          if ($hostTriple -ne 'aarch64-pc-windows-msvc') {
            throw "Expected native ARM64 Rust, found $hostTriple."
          }

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Shared subtitle core and JNI adapter
        shell: bash
        run: bash scripts/check-shared-core.sh

      - name: Compile ARM64 app without an installer
        if: ${{ needs.scope.outputs.arm_bundle == 'true' }}
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Smoke launch ARM64 UI-test app
        if: ${{ needs.scope.outputs.arm_bundle == 'true' }}
        shell: pwsh
        run: ./scripts/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture arm64

  msrv:
    needs: scope
    if: ${{ needs.scope.outputs.native == 'true' }}
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
          shared-key: msrv

      - name: Check minimum supported Rust version
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Shared native packaging invariants
        run: python3 -B scripts/shared-core-native-test.py

      - name: Test AppImage permission regression
        run: python3 scripts/check-appimage-permissions-test.py

      - name: Test AppImage GLES dependency regression
        run: python3 scripts/check-appimage-gles-test.py

      - name: Verify updater platform mapping
        run: node --test scripts/updater-manifest.node.mjs

      - name: Typecheck and build
        run: npm run build

  # Compile macOS without producing an extra branch artifact. Tag builds below
  # verify maintainer-signed macOS assets and build Windows/Linux packages.
  bundle:
    needs: scope
    if: ${{ github.ref_type != 'tag' && needs.scope.outputs.bundle == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.bundle_os) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - run: npm ci

      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-ci-deps.sh

      - name: Compile macOS without a runnable bundle
        if: ${{ matrix.os == 'macos-latest' }}
        run: npm run tauri -- build --no-bundle -- --locked

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        if: ${{ matrix.os == 'windows-2025' }}
        with:
          args: --config src-tauri/tauri.ci.conf.json

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: ./scripts/build-linux-packages.sh --config src-tauri/tauri.ci.conf.json

      - name: Install and smoke-test Linux packages
        if: runner.os == 'Linux'
        run: ./scripts/verify-linux-bundles.sh "$(node -p 'require("./package.json").version')"

      - name: Smoke launch x64 UI-test app
        if: ${{ matrix.os == 'windows-2025' }}
        shell: pwsh
        run: ./scripts/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64

      - name: Package and verify portable Windows build
        if: ${{ matrix.os == 'windows-2025' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/package-windows-portable.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -Version $version -OutputDirectory ./src-tauri/target/release/bundle/portable

      - name: Smoke launch extracted portable x64 app
        if: ${{ matrix.os == 'windows-2025' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = "./src-tauri/target/release/bundle/portable/mimi_${version}_x64-portable.zip"
          $extracted = Join-Path $env:RUNNER_TEMP 'mimi-portable-smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          ./scripts/windows-ci-smoke.ps1 -ExecutablePath (Join-Path $extracted 'mimi.exe') -ExpectedArchitecture x64

      - name: Upload bundles
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimi-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  ci-complete:
    if: ${{ always() }}
    needs: [scope, frontend, rust, msrv, windows-arm64, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Require planned checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          required = ["scope", "frontend"]
          plan = results["scope"]["outputs"]
          if plan.get("native") == "true":
              required += ["rust", "msrv"]
          if plan.get("windows_arm") == "true":
              required.append("windows-arm64")
          if plan.get("bundle") == "true":
              required.append("bundle")
          failed = [name for name in required if results[name]["result"] != "success"]
          if failed:
              raise SystemExit("Planned checks did not pass: " + ", ".join(failed))
          PY

  release-preflight:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json").version;
            const packageLock = require("./package-lock.json").packages[""].version;
            const tauri = require("./src-tauri/tauri.conf.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8")
              .match(/^version = "([^"]+)"/m)?.[1];
            const android = fs.readFileSync("android/version.properties", "utf8")
              .match(/^versionName=(.+)$/m)?.[1];
            if (android !== pkg) throw new Error(`Android ${android} must match desktop ${pkg}`);
            const expected = `v${pkg}`;
            if (process.env.RELEASE_TAG !== expected || packageLock !== pkg || tauri !== pkg || cargo !== pkg) {
              throw new Error(`release versions disagree: tag=${process.env.RELEASE_TAG}, package=${pkg}, packageLock=${packageLock}, tauri=${tauri}, cargo=${cargo}`);
            }
          '
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

  # The maintainer stages stable-signed macOS assets in a draft BEFORE pushing
  # the tag. The signing private key stays on that Mac, as it does for Kiri.
  # Hosted runners verify the pinned certificate; they never create ad-hoc apps.
  release-macos:
    if: ${{ github.ref_type == 'tag' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            dmg_arch: aarch64
            archive: mimi.app.tar.gz
          - arch: x86_64
            dmg_arch: x64
            archive: mimi_x64.app.tar.gz
    runs-on: macos-latest
    # GitHub requires push access to read an unpublished release draft.
    # Limit this permission to the release-only job; ordinary CI stays read-only.
    permissions:
      contents: write
    needs: [rust, msrv, frontend, release-preflight]
    env:
      MAC_ARCH: ${{ matrix.arch }}
      MAC_DMG_ARCH: ${{ matrix.dmg_arch }}
      MAC_ARCHIVE: ${{ matrix.archive }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - run: npm ci
      - run: npm run build

      - name: Download maintainer-signed macOS assets from the draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" == true ]] || {
            echo "Stage the maintainer-signed macOS assets in a draft before pushing the tag." >&2
            exit 1
          }
          staging_dir="$RUNNER_TEMP/mimi-release-assets"
          mkdir -p "$staging_dir"
          gh release download "$GITHUB_REF_NAME" --dir "$staging_dir" \
            --pattern "mimi_${GITHUB_REF_NAME#v}_${MAC_DMG_ARCH}.dmg" \
            --pattern "$MAC_ARCHIVE"
          [[ -s "$staging_dir/$MAC_ARCHIVE" ]]

      - name: Verify stable identity, DMG, and signed source revision
        shell: bash
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/mimi-release-assets"
          python3 scripts/extract-macos-updater.py \
            "$staging_dir/$MAC_ARCHIVE" "$RUNNER_TEMP/mimi-verified-updater"
          app_path="$RUNNER_TEMP/mimi-verified-updater/mimi.app"
          # The disposable runner has no local self-signed trust entry. Trust
          # only the exact pinned public certificate, and only for code signing.
          certificate_prefix="$RUNNER_TEMP/mimi-release-cert-"
          codesign --display --extract-certificates="$certificate_prefix" "$app_path"
          fingerprint="$(shasum -a 1 "${certificate_prefix}0" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$fingerprint" == "$(tr -d '[:space:]' < scripts/macos-release-identity.txt)" ]] || {
            echo "The embedded signing certificate differs from the pinned identity." >&2
            exit 1
          }
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "${certificate_prefix}0"
          ./scripts/verify-macos-release.sh \
            "$app_path" "$staging_dir/mimi_${GITHUB_REF_NAME#v}_${MAC_DMG_ARCH}.dmg"
          ./scripts/verify-macos-release-source.sh "$app_path" "$GITHUB_SHA" "${GITHUB_REF_NAME#v}" "$MAC_ARCH"

      - name: Sign verified macOS updater with the existing update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Updater signing key is missing}"
          staging_dir="$RUNNER_TEMP/mimi-release-assets"
          npm run tauri -- signer sign "$staging_dir/$MAC_ARCHIVE"
          public_key="$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey')"
          cargo run --release --locked --manifest-path src-tauri/Cargo.toml \
            --example verify_updater_signature -- \
            "$public_key" "$staging_dir/$MAC_ARCHIVE.sig" "$staging_dir/$MAC_ARCHIVE"

      - name: Upload verified macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimi-release-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/mimi-release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove runner-only certificate trust
        if: always()
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/mimi-release-cert-0"
          if [[ -f "$certificate" ]]; then
            # security can wait indefinitely for authorization services on a
            # hosted runner. Bound cleanup; the disposable VM is then discarded.
            sudo -n python3 - "$certificate" <<'PYTHON'
          import subprocess, sys
          try:
              subprocess.run(
                  ["/usr/bin/security", "remove-trusted-cert", "-d", sys.argv[1]],
                  check=False, timeout=15,
              )
          except subprocess.TimeoutExpired:
              print("Runner trust cleanup timed out; the disposable VM will be discarded.")
          PYTHON
          fi

  release-windows:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-2025
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    needs: [rust, msrv, frontend, release-preflight]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - run: npm ci

      - name: Verify updater signing secrets are configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Updater signing secrets are not configured."
          }

      - name: Remove stale Windows package outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/msi" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis" -ErrorAction SilentlyContinue

      - run: npm run tauri -- build -- --locked

      - name: Verify release excludes development debugger
        shell: pwsh
        run: |
          python scripts/check-production-native-debugger.py src-tauri/target/release/mimi.exe
          if ($LASTEXITCODE -ne 0) { throw "Development debugger was included in the release." }

      - name: Smoke launch release x64 UI-test app
        shell: pwsh
        run: ./scripts/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64

      - name: Verify and stage Windows release assets
        shell: pwsh
        run: |
          $version = (Get-Content "$env:GITHUB_WORKSPACE/package.json" | ConvertFrom-Json).version
          $bundleDir = "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle"
          $expectedPaths = @(
            "$bundleDir/msi/mimi_${version}_x64_en-US.msi",
            "$bundleDir/msi/mimi_${version}_x64_en-US.msi.sig",
            "$bundleDir/nsis/mimi_${version}_x64-setup.exe",
            "$bundleDir/nsis/mimi_${version}_x64-setup.exe.sig"
          )
          $actualInstallers = @(
            Get-ChildItem $bundleDir -Recurse -File |
              Where-Object { $_.Extension -eq '.msi' -or $_.Name -like '*-setup.exe' }
          )
          $actualSignatures = @(
            Get-ChildItem $bundleDir -Recurse -File -Filter '*.sig'
          )
          if ($actualInstallers.Count -ne 2 -or $actualSignatures.Count -ne 2) {
            throw "Expected exactly two Windows installers and their two updater signatures."
          }
          foreach ($expectedPath in $expectedPaths) {
            if (-not (Test-Path -LiteralPath $expectedPath -PathType Leaf)) {
              throw "Missing expected Windows package: $expectedPath"
            }
          }
          $expectedNames = @($expectedPaths | ForEach-Object { Split-Path $_ -Leaf } | Sort-Object)
          $actualFiles = @($actualInstallers) + @($actualSignatures)
          $actualNames = @($actualFiles | ForEach-Object { $_.Name } | Sort-Object)
          if (Compare-Object $actualNames $expectedNames) {
            throw "Windows package output contains an unexpected installer."
          }
          $stagingDir = "$env:RUNNER_TEMP/mimi-release-assets"
          New-Item -ItemType Directory -Force $stagingDir | Out-Null
          Copy-Item -LiteralPath $expectedPaths -Destination $stagingDir
          $publicKey = (Get-Content "$env:GITHUB_WORKSPACE/src-tauri/tauri.conf.json" | ConvertFrom-Json).plugins.updater.pubkey
          foreach ($installer in @("mimi_${version}_x64_en-US.msi", "mimi_${version}_x64-setup.exe")) {
            cargo run --release --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_signature -- $publicKey "$stagingDir/$installer.sig" "$stagingDir/$installer"
            if ($LASTEXITCODE -ne 0) {
              throw "Updater signature verification failed for $installer (exit $LASTEXITCODE)."
            }
          }
          ./scripts/package-windows-portable.ps1 -ExecutablePath "$env:GITHUB_WORKSPACE/src-tauri/target/release/mimi.exe" -Version $version -OutputDirectory $stagingDir

      - name: Smoke launch extracted release portable x64 app
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = "$env:RUNNER_TEMP/mimi-release-assets/mimi_${version}_x64-portable.zip"
          $extracted = Join-Path $env:RUNNER_TEMP 'mimi-release-portable-smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          ./scripts/windows-ci-smoke.ps1 -ExecutablePath (Join-Path $extracted 'mimi.exe') -ExpectedArchitecture x64

      - name: Upload verified Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimi-release-windows
          path: ${{ runner.temp }}/mimi-release-assets/*
          if-no-files-found: error
          retention-days: 7

  release-linux:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    needs: [rust, msrv, frontend, release-preflight]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target

      - name: Install Linux build and smoke-test dependencies
        run: ./scripts/linux-ci-deps.sh

      - run: npm ci

      - name: Verify updater signing key is configured
        run: ': "${TAURI_SIGNING_PRIVATE_KEY:?Updater signing key is missing}"'

      - name: Remove stale Linux package outputs
        run: rm -rf src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage

      - name: Build signed Linux packages
        run: ./scripts/build-linux-packages.sh

      - name: Verify release excludes development debugger
        run: python3 scripts/check-production-native-debugger.py src-tauri/target/release/mimi

      - name: Verify, install, and smoke-test signed Linux packages
        run: ./scripts/verify-linux-bundles.sh "$(node -p 'require("./package.json").version')" --signed

      - name: Stage verified Linux release assets
        run: |
          version="$(node -p 'require("./package.json").version')"
          staging_dir="$RUNNER_TEMP/mimi-release-assets"
          mkdir -p "$staging_dir"
          cp "src-tauri/target/release/bundle/deb/mimi_${version}_amd64.deb" \
            "src-tauri/target/release/bundle/appimage/mimi_${version}_amd64.AppImage" \
            "src-tauri/target/release/bundle/appimage/mimi_${version}_amd64.AppImage.sig" \
            "$staging_dir/"

      - name: Upload verified Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimi-release-linux
          path: ${{ runner.temp }}/mimi-release-assets/*
          if-no-files-found: error
          retention-days: 7

  release-android:
    if: ${{ github.ref_type == 'tag' }}
    needs: [release-preflight]
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  # Publish once, only after Android and every desktop package are verified.
  publish-release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs: [release-macos, release-windows, release-linux, release-android, windows-arm64]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mimi-release-*
          path: release-assets
          merge-multiple: true

      - name: Create, verify, and publish signed updater release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          version="${GITHUB_REF_NAME#v}"
          expected_names=(
            "mimi_${version}_aarch64.dmg"
            "mimi.app.tar.gz"
            "mimi.app.tar.gz.sig"
            "mimi_${version}_x64.dmg"
            "mimi_x64.app.tar.gz"
            "mimi_x64.app.tar.gz.sig"
            "mimi_${version}_x64-setup.exe"
            "mimi_${version}_x64-setup.exe.sig"
            "mimi_${version}_x64_en-US.msi"
            "mimi_${version}_x64_en-US.msi.sig"
            "mimi_${version}_x64-portable.zip"
            "mimi_${version}_amd64.deb"
            "mimi_${version}_amd64.AppImage"
            "mimi_${version}_amd64.AppImage.sig"
            "mimi_${version}_android.apk"
          )
          mapfile -t actual_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          mapfile -t expected_names < <(printf '%s\n' "${expected_names[@]}" | sort)
          if [[ "${actual_names[*]}" != "${expected_names[*]}" ]]; then
            echo "Downloaded artifacts do not exactly match the expected release assets." >&2
            printf 'expected: %s\n' "${expected_names[*]}" >&2
            printf 'actual: %s\n' "${actual_names[*]}" >&2
            exit 1
          fi

          remote_commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "The release tag no longer points to this workflow commit." >&2
            exit 1
          fi

          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            highest_version="$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -1)"
            if [[ "$highest_version" != "$version" || "$latest_version" == "$version" ]]; then
              echo "Refusing to publish $version as Latest over existing release $latest_version." >&2
              exit 1
            fi
          fi

          node -e '
            const fs = require("node:fs");
            const path = `docs/releases/${process.env.GITHUB_REF_NAME}.md`;
            const notes = fs.readFileSync(path, "utf8").trim();
            if (!/^## English$/m.test(notes) || !/^## 中文$/m.test(notes) ||
                notes.indexOf("## English") > notes.indexOf("## 中文")) {
              throw new Error(`${path} must contain reviewed English-first bilingual release notes`);
            }
            fs.writeFileSync("release-notes.md", `${notes}\n`);
          '

          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/updater-manifest.mjs create \
            release-assets release-assets/latest.json "$version" "$GH_REPO" \
            "$GITHUB_REF_NAME" "$pub_date" release-notes.md
          node scripts/updater-manifest.mjs verify \
            release-assets release-assets/latest.json "$version" "$GH_REPO" \
            "$GITHUB_REF_NAME"
          (
            cd release-assets
            sha256sum \
              "mimi_${version}_aarch64.dmg" \
              mimi.app.tar.gz mimi.app.tar.gz.sig \
              "mimi_${version}_x64.dmg" \
              mimi_x64.app.tar.gz mimi_x64.app.tar.gz.sig \
              "mimi_${version}_x64-setup.exe" \
              "mimi_${version}_x64-setup.exe.sig" \
              "mimi_${version}_x64_en-US.msi" \
              "mimi_${version}_x64_en-US.msi.sig" \
              "mimi_${version}_x64-portable.zip" \
              "mimi_${version}_amd64.deb" \
              "mimi_${version}_amd64.AppImage" \
              "mimi_${version}_amd64.AppImage.sig" \
              "mimi_${version}_android.apk" \
              latest.json > SHA256SUMS.txt
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on an already-published release." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "mimi $GITHUB_REF_NAME" --notes-file release-notes.md
          fi

          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

          mapfile -t expected_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          mapfile -t published_names < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          if [[ "${expected_names[*]}" != "${published_names[*]}" ]]; then
            echo "Draft release assets do not exactly match the verified build outputs." >&2
            printf 'expected: %s\n' "${expected_names[*]}" >&2
            printf 'actual: %s\n' "${published_names[*]}" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            asset_name="${asset##*/}"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_digest="$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$asset_name\") | .digest")"
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "The uploaded digest does not match $asset_name." >&2
              exit 1
            fi
          done

          remote_commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "The release tag moved while assets were uploading." >&2
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --title "mimi $GITHUB_REF_NAME" --notes-file release-notes.md --draft=false --latest

          public_manifest="public-latest.json"
          expected_manifest_digest="$(sha256sum release-assets/latest.json | cut -d ' ' -f 1)"
          manifest_ready=0
          for _ in {1..12}; do
            if curl --fail --silent --show-error --location \
              "https://github.com/$GH_REPO/releases/latest/download/latest.json" \
              --output "$public_manifest" \
              && [[ "$(sha256sum "$public_manifest" | cut -d ' ' -f 1)" == "$expected_manifest_digest" ]]; then
              manifest_ready=1
              break
            fi
            sleep 5
          done
          if [[ "$manifest_ready" != "1" ]]; then
            echo "The public latest.json does not match the published manifest." >&2
            exit 1
          fi
          for asset_name in "${assets[@]##*/}"; do
            asset_ready=0
            for _ in {1..12}; do
              if curl --fail --silent --show-error --location --head \
                "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/$asset_name" >/dev/null; then
                asset_ready=1
                break
              fi
              sleep 5
            done
            if [[ "$asset_ready" != "1" ]]; then
              echo "Release asset is not publicly accessible: $asset_name" >&2
              exit 1
            fi
          done
