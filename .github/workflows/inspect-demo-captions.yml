name: Inspect source film captions
on:
  push:
    branches: [docs/english-video-demo]
    paths: [.github/workflows/inspect-demo-captions.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read subtitle tracks from the official open-movie source
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p film-captions
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          source='https://download.blender.org/demo/movies/Sintel.2010.1080p.mkv'
          out=Path('film-captions')
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-rw_timeout','20000000','-show_streams','-of','json',source],text=True,timeout=45))
          tracks=[s for s in data['streams'] if s['codec_type']=='subtitle']
          (out/'tracks.json').write_text(json.dumps(tracks,indent=2))
          print(json.dumps([{'index':s['index'],'codec':s['codec_name'],'tags':s.get('tags',{})} for s in tracks]))
          for track in tracks:
              language=track.get('tags',{}).get('language','')
              if language not in ['eng','chi','zho','jpn']:continue
              path=out/('subtitle-'+str(track['index'])+'.srt')
              subprocess.run(['ffmpeg','-v','error','-y','-rw_timeout','20000000','-ss','127','-i',source,'-t','31','-map','0:'+str(track['index']),'-c:s','srt',str(path)],check=True,timeout=60)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: film-reference-captions
          path: film-captions/
          retention-days: 3
          if-no-files-found: error
