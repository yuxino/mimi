name: Prepare English video demonstration
on:
  push:
    branches: [docs/english-video-demo]
    paths: [.github/workflows/prepare-video-demo.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the unchanged application frontend
        run: |
          git status -sb
          test -z "$(git status --porcelain)"
          npm ci
          npm run build
          mkdir -p prepared/dist
          cp -R dist/. prepared/dist/
          git rev-parse HEAD > prepared/source-commit.txt
      - name: Prepare a short licensed dialogue excerpt, not synthetic speech
        run: |
          sudo apt-get install -y ffmpeg
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json,hashlib,subprocess
          from pathlib import Path
          out=Path('prepared');base='https://download.blender.org/durian/movies/'
          listing=urllib.request.urlopen(base,timeout=30).read().decode()
          links=re.findall(r'href="([^"]+)"',listing)
          candidates=[x for x in links if 'sintel' in x.lower() and x.lower().endswith(('.mp4','.mkv'))]
          print('Official movie files:',candidates)
          choices=[x for x in candidates if '2048' in x and x.endswith('.mp4')]+[x for x in candidates if '1080' in x and x.endswith('.mp4')]+[x for x in candidates if '1080' in x and x.endswith('.mkv')]
          if not choices:raise SystemExit('No HD official movie found')
          url=urllib.parse.urljoin(base,choices[0])
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss','127','-i',url,'-t','31','-map','0:v:0','-map','0:a:0','-vf','scale=1920:-2','-c:v','libx264','-preset','fast','-crf','18','-c:a','aac','-b:a','192k','-ac','2','-movflags','+faststart',str(out/'sintel-excerpt.mp4')],check=True,timeout=240)
          subprocess.run(['ffmpeg','-v','error','-y','-i',str(out/'sintel-excerpt.mp4'),'-vn','-ar','16000','-ac','1','-f','s16le',str(out/'speech.pcm')],check=True)
          pages={}
          for name,url2 in [('sharing','https://durian.blender.org/sharing/'),('subtitles','https://durian.blender.org/wp-content/content/subtitles/sintel_en.srt')]:
            data=urllib.request.urlopen(url2,timeout=30).read();(out/(name+'.txt')).write_bytes(data);pages[name]=url2
          meta={'title':'Sintel','source_url':url,'source_page':'https://durian.blender.org/','license':'CC BY 3.0','license_url':'https://creativecommons.org/licenses/by/3.0/','attribution':'© copyright Blender Foundation | www.sintel.org','excerpt_start':127,'excerpt_duration':31,'changes':'Dialogue excerpt, resized to 1920 pixels wide; used as the video playing underneath the app demo.','pages':pages,'sha256':hashlib.sha256((out/'sintel-excerpt.mp4').read_bytes()).hexdigest()}
          (out/'source.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: english-video-preparation
          path: prepared/
          retention-days: 3
          if-no-files-found: error
