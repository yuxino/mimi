name: Translate the licensed film sample
on:
  push:
    branches: [docs/english-video-demo]
    paths: [.github/workflows/translate-film-sample.yml]
permissions:
  contents: read
  actions: read
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          run-id: 34038261225
          name: english-video-preparation
          github-token: ${{ github.token }}
          path: prepared
      - name: Normalize the decoder padding and prepare an ephemeral handoff key
        run: |
          python -m pip install aiohttp==3.12.15 cryptography==45.0.6 websockets==15.0.1
          python - <<'PY'
          import json,os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          pcm=Path('prepared/speech.pcm');data=pcm.read_bytes();limit=31*16000*2
          assert limit<=len(data)<limit+3200
          pcm.write_bytes(data[:limit])
          root=Path(os.environ['RUNNER_TEMP'])
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          path=root/'film-handoff-private.pem'
          path.write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          path.chmod(0o600)
          public=root/'film-public';public.mkdir()
          (public/'public.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          (public/'run.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID']}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: film-sample-public-key
          path: ${{ runner.temp }}/film-public/
          retention-days: 1
      - name: Translate exactly the provided 31-second public sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I docs/demos/english-film/translate-sample.py
      - name: Remove temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/film-handoff-private.pem"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: film-translation-review
          path: film-translation-review/
          retention-days: 3
          if-no-files-found: error
