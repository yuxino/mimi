name: Bug report
description: 报告可复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴 Workspace ID、API Key 或包含凭证的截图。
        Never include a Workspace ID, API key, or credential-bearing screenshot.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: "1. 打开…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他信息 / Additional context

