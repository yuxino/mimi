[package]
name = "mimi"
version = "1.3.1"
description = "Live translated subtitles for anything playing on your Mac or PC."
authors = ["yuxino <nbsawz@gmail.com>"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "mimi_lib"
# mimi ships desktop binaries only. The staticlib/cdylib outputs are for
# Tauri mobile targets and add hundreds of megabytes to local build caches.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# The stable development bundle is compiled in release mode, so expose the
# WebView inspector only when the launcher opts into this local-only feature.
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
semver = "1"
rubato = "5"

[target.'cfg(target_os = "macos")'.dependencies]
screen-capture-kit = "0.7.1"
core-media = "0.8"
core-graphics2 = { version = "0.6", features = ["display"] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-core-audio-types = { version = "0.3", features = ["objc2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSObject", "NSBundle"] }
dispatch2 = "0.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]

# Keep the shipped desktop binary compact without changing the debug/test
# profiles used during development. These are the stable-Rust settings
# recommended by Tauri for production bundles.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
