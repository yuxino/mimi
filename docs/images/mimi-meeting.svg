<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#1d2027"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="72" y="54" width="1776" height="972" rx="30" fill="#22252c" stroke="#ffffff" stroke-opacity=".06"/>
  <path d="M102 54h1716a30 30 0 0 1 30 30v48H72V84a30 30 0 0 1 30-30z" fill="#2b2e36"/>
  <circle cx="108" cy="92" r="9" fill="#ff5f57"/>
  <circle cx="138" cy="92" r="9" fill="#febc2e"/>
  <circle cx="168" cy="92" r="9" fill="#28c840"/>
  <text x="960" y="100" fill="#eef1f7" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="middle">Weekly Product Sync</text>

  <!-- Four calm meeting tiles, matching the product-scene composition used elsewhere -->
  <g>
    <rect x="104" y="164" width="826" height="338" rx="24" fill="#343a46"/>
    <circle cx="517" cy="320" r="74" fill="#8ab0ff"/>
    <text x="517" y="346" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">M</text>
    <rect x="128" y="442" width="142" height="38" rx="12" fill="#16191f" fill-opacity=".78"/>
    <text x="146" y="468" fill="#f1f3f7" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" font-weight="650">Maya</text>
  </g>
  <g>
    <rect x="954" y="164" width="862" height="338" rx="24" fill="#3a3543"/>
    <circle cx="1385" cy="320" r="74" fill="#b3a0ff"/>
    <text x="1385" y="346" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">K</text>
    <rect x="978" y="442" width="132" height="38" rx="12" fill="#16191f" fill-opacity=".78"/>
    <text x="996" y="468" fill="#f1f3f7" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" font-weight="650">Ken</text>
  </g>
  <g>
    <rect x="104" y="526" width="826" height="338" rx="24" fill="#304147"/>
    <circle cx="517" cy="682" r="74" fill="#83cec5"/>
    <text x="517" y="708" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">L</text>
    <rect x="128" y="804" width="134" height="38" rx="12" fill="#16191f" fill-opacity=".78"/>
    <text x="146" y="830" fill="#f1f3f7" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" font-weight="650">Lina</text>
  </g>
  <g>
    <rect x="954" y="526" width="862" height="338" rx="24" fill="#423c34"/>
    <circle cx="1385" cy="682" r="74" fill="#dfae7d"/>
    <text x="1385" y="708" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">A</text>
    <rect x="978" y="804" width="142" height="38" rx="12" fill="#16191f" fill-opacity=".78"/>
    <text x="996" y="830" fill="#f1f3f7" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" font-weight="650">Arjun</text>
  </g>

  <!-- Meeting controls stay behind mimi, like the other scene images keep app chrome secondary -->
  <rect x="720" y="934" width="480" height="60" rx="24" fill="#2d3139"/>
  <g fill="#41464f"><circle cx="776" cy="964" r="18"/><circle cx="848" cy="964" r="18"/><circle cx="920" cy="964" r="18"/><circle cx="992" cy="964" r="18"/><circle cx="1064" cy="964" r="18"/></g>
  <circle cx="1136" cy="964" r="18" fill="#d85d5d"/>

  <!-- Current mimi overlay: exact 640×136 reference size from SubtitleOverlayMetrics -->
  <g filter="url(#shadow)">
    <rect x="640" y="798" width="640" height="136" rx="0" fill="transparent"/>
    <rect x="646" y="804" width="628" height="124" rx="16" fill="#000" fill-opacity=".62"/>
    <rect x="646" y="804" width="628" height="124" rx="16" fill="url(#topSheen)"/>
    <rect x="646.5" y="804.5" width="627" height="123" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".12"/>

    <!-- Drag handle: 32×3 when not hovered -->
    <rect x="944" y="814" width="32" height="3" rx="1.5" fill="#fff" fill-opacity=".28"/>

    <!-- Language status pill, current non-hover treatment -->
    <rect x="658" y="814" width="205" height="20" rx="10" fill="#7aa8ff" fill-opacity=".075" stroke="#7aa8ff" stroke-opacity=".14" stroke-width=".5"/>
    <g fill="#7aa8ff" fill-opacity=".62">
      <rect x="666" y="821" width="2.25" height="6" rx="1.1"/>
      <rect x="671" y="818.5" width="2.25" height="11" rx="1.1"/>
      <rect x="676" y="820" width="2.25" height="8" rx="1.1"/>
    </g>
    <text x="684" y="828" fill="#7aa8ff" fill-opacity=".8" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600">English</text>
    <text x="723" y="828" fill="#fff" fill-opacity=".32" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10">→</text>
    <text x="735" y="828" fill="#fff" fill-opacity=".56" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600">简体中文</text>
    <line x1="780" y1="819" x2="780" y2="828" stroke="#fff" stroke-opacity=".14" stroke-width=".5"/>
    <text x="788" y="828" fill="#7aa8ff" fill-opacity=".74" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="9">✦</text>
    <text x="800" y="828" fill="#fff" fill-opacity=".52" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600">高质量</text>
    <path d="M849 821l3 3 3-3" fill="none" stroke="#fff" stroke-opacity=".30" stroke-width="1"/>

    <!-- Only the always-visible controls: pause + collapse -->
    <rect x="1200" y="814" width="24" height="24" rx="8" fill="#000" fill-opacity=".28"/>
    <rect x="1230" y="814" width="24" height="24" rx="8" fill="#000" fill-opacity=".28"/>
    <rect x="1208" y="821" width="3" height="10" rx="1" fill="#fff" fill-opacity=".68"/>
    <rect x="1214" y="821" width="3" height="10" rx="1" fill="#fff" fill-opacity=".68"/>
    <path d="M1237 826l5-5 5 5" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtitle timeline: recent confirmed line + current line, matching current hierarchy -->
    <text x="694" y="858" text-anchor="end" fill="#7aa8ff" fill-opacity=".28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="500">10:25</text>
    <text x="702" y="858" fill="#fff" fill-opacity=".34" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14">API 迁移现在还是最主要的阻塞点。</text>

    <text x="694" y="884" text-anchor="end" fill="#7aa8ff" fill-opacity=".46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="500">10:26</text>
    <text x="702" y="884" fill="#fff" fill-opacity="1" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="500">先小范围放量，盯住错误率，再决定要不要继续扩大。</text>

    <!-- Compact 5-bar activity waveform under visible subtitles -->
    <g fill="#7aa8ff" fill-opacity=".62">
      <rect x="944" y="899" width="2.75" height="6" rx="1.4"/>
      <rect x="951" y="896" width="2.75" height="12" rx="1.4"/>
      <rect x="958" y="893" width="2.75" height="18" rx="1.4"/>
      <rect x="965" y="896" width="2.75" height="12" rx="1.4"/>
      <rect x="972" y="899" width="2.75" height="6" rx="1.4"/>
    </g>
  </g>
</svg>